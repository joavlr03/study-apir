```properties
spring.application.name=study-api
server.port=8080

springdoc.swagger-ui.path=/
api.version=v1

# Database
# Quando a API está em um container e o MySQL está no host,
# use host.docker.internal como DB_SERVER_URL.
spring.datasource.url=jdbc:mysql://${DB_SERVER_URL}:${DB_SERVER_PORT}/${DB_SCHEMA}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PWD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
```
